<!-- filename: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card — Vertical</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Avatar -->
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="#ffffff" width="70" height="70">
        <path d="M12 12a4.8 4.8 0 1 0 0-9.6 4.8 4.8 0 0 0 0 9.6zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>

    
    <h1 class="name">Jordan Reyes</h1>
    <p class="title">Senior Consultant</p>
    <p class="bio">
      Focused on cloud data architecture and AI-driven analytics
      for enterprise clients. Always up for a good whiteboard session.
    </p>

  
    <div class="stars">★★★★<span class="half">★</span></div>

    <hr class="divider">

   
    <div class="stats">
      <div class="stat"><span class="stat-number">128</span><span class="stat-label">Projects</span></div>
      <div class="stat"><span class="stat-number">4.5</span><span class="stat-label">Rating</span></div>
      <div class="stat"><span class="stat-number">36</span><span class="stat-label">Reviews</span></div>
    </div>

    
    <div class="buttons">
      <button class="btn" aria-label="Call">
        <svg viewBox="0 0 24 24" fill="#ffffff" width="20" height="20"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
      </button>
      <button class="btn" aria-label="Message">
        <svg viewBox="0 0 24 24" fill="#ffffff" width="20" height="20"><path d="M4 4h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H7l-4 4V6c0-1.1.9-2 2-2z"/></svg>
      </button>
    </div>
  </div>

</body>
</html>
